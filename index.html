<!DOCTYPE html>
<html>
<body>
<h3>Activation Code Generator</h3>

<input id="clientName" placeholder="Enter client name"><br><br>
<input id="original" placeholder="Enter code like 8F-A9-33-BC-1D"><br><br>
<button onclick="generate()">Generate Activation Code</button>

<p>Activation Code: <span id="result"></span></p>

<script>
async function generate() {
    const secret = "oxYWgrnQ7QoCLofDeGDHAwwCW0hDMrjqqI2tp+Kxx6imxMcrW7b8we10PKx2W3DnXd3rO7bMemmXTmA2tfY2ew==";
    const clientName = document.getElementById("clientName").value;
    const code = document.getElementById("original").value;
    if (!clientName || !code) { alert("Enter client name and code!"); return; }

    // Generate activation code (HMAC)
    const codeData = new TextEncoder().encode(code);
    const keyData = Uint8Array.from(atob(secret), c => c.charCodeAt(0));

    const cryptoKey = await crypto.subtle.importKey(
        "raw",
        keyData,
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
    );

    const signature = await crypto.subtle.sign("HMAC", cryptoKey, codeData);
    const hashArray = Array.from(new Uint8Array(signature));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
    const activationCode = hashHex.substring(0, 20).toUpperCase();

    document.getElementById("result").innerText = activationCode;

    // Save to Google Drive via Apps Script
    const webAppUrl = "https://script.google.com/macros/s/AKfycbztKJf34Qymy9jDwMSo5St2yIiOrtITSlegdBC1w7wOXj12gpKcZ419PAtiMgbJBXRBmw/exec"; // replace with your Apps Script URL

    fetch(webAppUrl, {
        method: "POST",
        body: JSON.stringify({
            clientName: clientName,
            activationCode: activationCode
        }),
        headers: { "Content-Type": "application/json" }
    })
    .then(res => res.json())
    .then(data => console.log("Saved:", data))
    .catch(err => console.error(err));
}
</script>
</body>
</html>
